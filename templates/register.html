{% extends "base.html" %}
{% load static %}

<!-- Sincronizamos el fondo oscuro premium de CreaVende -->
{% block background_color %}#0F172A{% endblock %}

{% block title %}Registrarse - CreaVende{% endblock %}

{% block content %}
<!-- Contenedor forzado con CSS nativo para garantizar el centrado absoluto en tu monitor -->
<div style="display: flex; justify-content: center; align-items: center; min-height: 75vh; width: 100%; padding: 20px; box-sizing: border-box;">
    
    <!-- Tarjeta Premium Centrada -->
    <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; background-color: #1E293B; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4) !important;">
        
        <h2 class="text-center mb-4 fw-bold text-white" style="letter-spacing: -0.5px;">Regístrate en CreaVende</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <!-- Campo: Usuario -->
            <div class="mb-3">
                <label for="username" class="form-label fw-medium" style="color: #94A3B8; font-size: 0.9rem;">Usuario</label>
                <input type="text" name="username" id="username" class="form-control text-white" placeholder="Crea tu nombre de usuario" required 
                       style="background-color: #0F172A !important; border: 1px solid #475569; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box;">
            </div>

            <!-- Campo: Correo Electrónico -->
            <div class="mb-3">
                <label for="email" class="form-label fw-medium" style="color: #94A3B8; font-size: 0.9rem;">Correo Electrónico</label>
                <input type="email" name="email" id="email" class="form-control text-white" placeholder="ejemplo@correo.com" required 
                       style="background-color: #0F172A !important; border: 1px solid #475569; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box;">
            </div>
            
            <!-- Campo: Contraseña -->
            <div class="mb-4">
                <label for="password" class="form-label fw-medium" style="color: #94A3B8; font-size: 0.9rem;">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control text-white" placeholder="Asigna una contraseña segura" required 
                       style="background-color: #0F172A !important; border: 1px solid #475569; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box;">
            </div>
            
            <!-- Botón de Registro Azul Eléctrico -->
            <button type="submit" class="btn fw-bold text-white py-2" style="background-color: #3B82F6; border: none; border-radius: 8px; width: 100%; transition: background 0.2s;">
                Crear Cuenta Gratuita
            </button>
        </form>
        
        <!-- Enlace inferior -->
        <p class="text-center mt-4 mb-1" style="color: #94A3B8; font-size: 0.9rem;">
            ¿Ya tienes cuenta? <a href="{% url 'shop:user_login' %}" class="fw-bold text-decoration-none" style="color: #3B82F6;">Inicia Sesión aquí</a>
        </p>
    </div>
</div>

<!-- Estilos interactivos para iluminar los campos enfocados -->
<style>
    input:focus {
        border-color: #3B82F6 !important;
        outline: none;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
    }
    button:hover {
        background-color: #2563EB !important;
    }
</style>
{% endblock %}
